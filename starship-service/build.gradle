plugins {
    id 'war'
    id 'org.openapi.generator' version '7.25.0'
}

dependencies {
    implementation 'org.springframework:spring-webmvc:5.3.39'
    implementation 'org.springframework:spring-jdbc:5.3.39'
    implementation 'org.springframework:spring-tx:5.3.39'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.0'
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.postgresql:postgresql:42.7.14'
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

war {
    archiveFileName = 'starship-service.war'
}

def generatedSources = layout.buildDirectory.dir('generated/openapi')

openApiGenerate {
    generatorName = 'spring'
    inputSpec = rootProject.file('docs/openapi.yaml').absolutePath
    outputDir = generatedSources.get().dir('server').asFile.absolutePath
    cleanupOutput = true
    apiPackage = 'ru.itmo.soa.starship.generated.api'
    modelPackage = 'ru.itmo.soa.starship.generated.model'
    modelNameSuffix = 'Dto'
    globalProperties = [apis: 'Starship', models: '']
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            interfaceOnly: 'true',
            skipDefaultInterface: 'true',
            useSpringBoot3: 'false',
            useJakartaEe: 'false',
            useTags: 'true',
            openApiNullable: 'false',
            documentationProvider: 'none',
            annotationLibrary: 'none',
            hideGenerationTimestamp: 'true',
            sourceFolder: 'src/main/java'
    ]
}

tasks.register('generateSpaceMarineClient', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'java'
    library = 'resttemplate'
    inputSpec.set(rootProject.layout.projectDirectory.file('docs/openapi.yaml'))
    outputDir.set(generatedSources.get().dir('space-marine-client'))
    cleanupOutput = true
    templateDir.set(layout.projectDirectory.dir('openapi-templates'))
    apiPackage = 'ru.itmo.soa.starship.generated.client.api'
    modelPackage = 'ru.itmo.soa.starship.generated.client.model'
    modelNameSuffix = 'Dto'
    globalProperties = [apis: 'SpaceMarines', models: '', supportingFiles: '']
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            useJakartaEe: 'false',
            dateLibrary: 'java8',
            useTags: 'true',
            openApiNullable: 'false',
            documentationProvider: 'none',
            annotationLibrary: 'none',
            hideGenerationTimestamp: 'true',
            sourceFolder: 'src/main/java'
    ]
}

sourceSets {
    main {
        java {
            srcDir generatedSources.map { it.dir('server/src/main/java') }
            srcDir generatedSources.map { it.dir('space-marine-client/src/main/java') }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate'), tasks.named('generateSpaceMarineClient')
}

tasks.named('test') {
    useJUnitPlatform()
}
